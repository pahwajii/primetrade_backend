<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrimeTrade Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-shape shape-one"></div>
    <div class="bg-shape shape-two"></div>
    <main class="container auth-container">
      <header class="hero">
        <p class="eyebrow">PrimeTrade Assignment</p>
        <h1>Sign In</h1>
        <p class="subtitle">Log in to access your protected dashboard and tasks.</p>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <section class="card narrow-card">
        <form id="loginForm" class="form">
          <label>
            Email
            <input type="email" name="email" required placeholder="jane@example.com" />
          </label>
          <label>
            Password
            <input type="password" name="password" required placeholder="StrongPass@123" />
          </label>
          <button type="submit">Sign In</button>
        </form>
        <p class="switch-link">Need an account? <a href="/create-account">Create Account</a></p>
        <p class="switch-link"><a href="/">Go to Dashboard</a></p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
